name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Una sola versión de Flutter para todos los jobs. Cámbiala acá cuando toque
# actualizar, y deja registro en DECISIONS.md.
env:
  FLUTTER_VERSION: '3.47.1'
  APP_DIR: el_kiosko

jobs:
  verify:
    name: Formato, análisis y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencias
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Formato
        working-directory: ${{ env.APP_DIR }}
        run: dart format --set-exit-if-changed lib test

      - name: Análisis estático
        working-directory: ${{ env.APP_DIR }}
        run: flutter analyze

      - name: Tests
        working-directory: ${{ env.APP_DIR }}
        run: flutter test --reporter expanded

  build:
    name: App Bundle de release
    runs-on: ubuntu-latest
    needs: verify
    # Los secretos se exponen a nivel de job: el contexto `secrets` no está
    # disponible dentro del `if:` de un step, pero `env` sí.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencias
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      # La firma real sólo ocurre si los secretos están configurados. Sin
      # ellos el AAB se firma con la clave de debug: sirve para verificar que
      # compila, pero NO se puede subir a Play. Ver PLAY_STORE_CHECKLIST.md.
      - name: Preparar firma de release
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks
          cat > key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Compilar AAB
        working-directory: ${{ env.APP_DIR }}
        run: flutter build appbundle --release

      - name: Borrar material de firma
        if: always()
        working-directory: ${{ env.APP_DIR }}/android
        run: rm -f upload-keystore.jks key.properties

      - uses: actions/upload-artifact@v7
        with:
          name: app-release-aab
          path: ${{ env.APP_DIR }}/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
