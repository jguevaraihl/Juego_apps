name: almacen
description: "El Kiosko — Almacén de Barrio. Juego de merge y administración ligera."
publish_to: 'none'

# versionName+versionCode. Sube versionCode en cada subida a Play.
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Formato de números por locale (separador decimal).
  intl: any
  # Estado. Ver DECISIONS.md D-004.
  flutter_riverpod: ^3.0.0
  # Ruta del directorio de documentos para el archivo de guardado (móvil).
  path_provider: ^2.1.5
  # Acceso a localStorage en la build web, que existe sólo para demos.
  web: ^1.1.1
  # Efectos de sonido cortos. Los archivos son generados por
  # tools/generate_sounds.py (ver ASSET_LICENSES.md).
  audioplayers: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Genera AppLocalizations desde lib/l10n/*.arb (ver l10n.yaml).
  generate: true
  assets:
    - assets/sounds/
  # El arte sigue dibujándose en código; sólo hay assets de audio.
